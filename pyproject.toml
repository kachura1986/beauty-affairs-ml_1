[project]
name = "beauty-affairs-ml"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
back = [
    "fastapi>=0.159.1",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
    "langgraph==1.2.16",
    "openai==3.35.1",
    "aiohttp==3.14.5",
    "azure-search-documents==12.0.0",
]

lint = [
    "ruff",
    "mypy",
]

test = [
    "pytest",
    "pytest-asyncio"
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
show_error_codes = true
pretty = true
follow_imports = "silent"
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]