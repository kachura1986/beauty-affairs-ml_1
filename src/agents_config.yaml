default_agent:
  model:
    model_name: gpt-4o-mini
    temperature: 0
    max_tokens: 8192          # per-call max_output_tokens; NOT budget.max_tokens
    input_cost_per_million: 2.75
    output_cost_per_million: 11.0
  policy:
    empty_limit: 2
    repeat_limit: 3
    finalize_on_max_steps: true
  budget:
    max_steps: 8
    max_seconds: 400
    max_tokens: 80000        # run-wide token budget; NOT model.max_tokens
    max_cost: 0.5         # 0 = free model (run stops on any nonzero cost)
  tools:                     # whitelist of tool names; omit the block = all available tools, [] = no tools
    - get_datetime
    - search_products